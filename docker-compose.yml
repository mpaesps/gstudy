services:
  postgres:
    image: postgres:16-alpine
    container_name: gstudy-postgres
    environment:
      POSTGRES_DB: gstudy
      POSTGRES_USER: gstudy
      POSTGRES_PASSWORD: gstudy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gstudy -d gstudy"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gstudy-backend
    environment:
      DATABASE_URL: postgresql://gstudy:gstudy@postgres:5432/gstudy?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 1d
      PORT: 3333
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gstudy-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
